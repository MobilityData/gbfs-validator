name: Run unit tests

on: push

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.22.3'

      - name: setup node-gyp
        run: npm install -g node-gyp@latest
   
      - name: Run tests
        run: yarn install && yarn workspaces run test
